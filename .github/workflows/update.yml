name: Daily odds update

on:
  schedule:
    - cron: "0 * * * *"    # hourly: captures roster, player-news, projection and live-score movements
  workflow_dispatch:
    inputs:
      rebuild_tooltips:
        description: Rewrite retained transaction captions with the event-copy worker
        required: false
        default: false
        type: boolean
      tooltip_only:
        description: Run only the retained transaction-caption worker
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch league and simulate
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_CLASSIFIER: typesafe/jev-1.13
          OPENROUTER_MODEL_EXPLAINER: openai/gpt-5.6-luna
          OPENROUTER_MODEL_EVENT_COPY: openai/gpt-5.6-luna
          OPENROUTER_REASONING_EFFORT: low
        run: |
          if [ "${{ inputs.tooltip_only }}" = "true" ]; then
            python scripts/timeline_events.py
          else
            python scripts/update.py
            if [ "${{ inputs.rebuild_tooltips }}" = "true" ]; then
              python scripts/timeline_events.py
            fi
          fi
      - name: Commit snapshot
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add docs/data data/state
          git diff --cached --quiet || git commit -m "Daily odds $(date -u +%F)"
          git push
